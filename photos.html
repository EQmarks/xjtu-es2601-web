.pgal-hd{background:linear-gradient(125deg,#5C0713 0%,#8B0A1E 48%,#A00C24 100%);

.pgal-hd::after{content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(60deg,rgba(255,255,255,.04) 0 2px,transparent 2px 44px)}
.pgal-hd .wrap{position:relative;z-index:2}
.pgal-hd h1{font-size:28px;letter-spacing:2px}
.pgal-hd p{margin-top:10px;color:var(--accent-light);font-size:14.5px}
.pgal-jump{display:flex;align-items:center;gap:12px;padding:0 0 20px}
.pgal-jump label{font-size:13px;color:var(--text-2);flex:0 0 auto}
.pgal-jump select{width:100%;max-width:560px;min-width:0;height:42px;padding:0 32px 0 12px;

  font-size:14px;text-overflow:ellipsis}
.pgal-jump select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 时间轴 */
.pgal-sec{padding:22px 0 26px;border-top:1px solid var(--line);scroll-margin-top:64px}
.pgal-sec:first-child{border-top:none}
.pgal-date{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.pgal-date .d{font-size:20px;font-weight:700;color:var(--brand);
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
.pgal-date .n{font-size:12.5px;color:var(--text-3)}
.pgal-sec h2{font-size:16.5px;color:var(--text);padding-left:12px;position:relative;margin-bottom:4px}
.pgal-sec h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:16px;background:var(--accent);border-radius:2px}
.pgal-meta{font-size:12.5px;color:var(--text-3);margin:6px 0 14px;padding-left:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.6}
.pgal-meta .ch{align-self:center;padding:2px 9px;border-radius:2px;
  background:var(--brand-tint);color:var(--brand);border:1px solid #F0C9CF;font-size:11.5px;
  line-height:1.35;white-space:nowrap}
